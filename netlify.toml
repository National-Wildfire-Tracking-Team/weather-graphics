# Static site: no build step. The Newsroom Graphics Studio is the home page (/); the Weather Plate Builder is at /plate-builder.html.
[build]
  publish = "site"

[[redirects]]
  from = "/studio"
  to = "/"
  status = 301

[[redirects]]
  from = "/studio/*"
  to = "/:splat"
  status = 301

[[headers]]
  for = "/config.json"
  [headers.values]
    Cache-Control = "no-cache"
