<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920,height=1080">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<title>NWTT live output</title>
<!-- OBS Browser Source output (Phase 2). Read-only: shows only the session's approved live graphic. No controls, no text. -->
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: transparent !important; }
  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; pointer-events: none; }
  #stage img { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; opacity: 0; transition: opacity var(--fade, 400ms) ease; }
  #stage img.on { opacity: 1; }
  #stage img.cut { transition: none; }
</style>
</head>
<body>
<div id="stage" aria-hidden="true"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js" integrity="sha384-TcHRA3zBbn+Lexh5n+Oil4guNPOS3rjNDpGRAN46u/s/mB2IZ50ceC6TYDU2yvgK" crossorigin="anonymous"></script>
<script src="/broadcast/output.js"></script>
</body>
</html>
